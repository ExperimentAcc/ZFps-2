name: fps_monitor
description: FPS monitoring app for gamers and phone testers — real-time FPS, CPU/GPU temperature, free RAM, storage speed and per-session performance reports, powered by Shizuku.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
