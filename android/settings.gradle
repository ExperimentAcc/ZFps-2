pluginManagement {
    def localPropertiesFile = new File(rootDir, "local.properties")
    def properties = new Properties()
    if (localPropertiesFile.exists()) {
        localPropertiesFile.withInputStream { stream -> properties.load(stream) }
    }
    def flutterSdkPath = properties.getProperty("flutter.sdk") ?: properties.getProperty("flutter.dir")
    if (flutterSdkPath == null) {
        throw new GradleException(
            "flutter.sdk not set in android/local.properties. " +
            "Generate it with: echo \"flutter.sdk=\$FLUTTER_HOME\" > android/local.properties"
        )
    }
    includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
}

include ":app"
