include ":app"

// Include Flutter plugin subprojects from .flutter-plugins (generated by `flutter pub get`)
// so Flutter's Gradle plugin can resolve them as API dependencies.
def flutterProjectDir = rootDir.parentFile
def flutterPluginsFile = new File(flutterProjectDir, ".flutter-plugins")
if (flutterPluginsFile.exists()) {
    flutterPluginsFile.readLines().each { line ->
        def parts = line.split("=")
        if (parts.size() == 2) {
            def name = parts[0].trim()
            def path = parts[1].trim()
            def pluginDir = new File(flutterProjectDir, path)
            if (pluginDir.exists()) {
                include ":$name"
                project(":$name").projectDir = pluginDir
            }
        }
    }
}
