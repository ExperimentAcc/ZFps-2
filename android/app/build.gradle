plugins {
    id "com.android.application"
    id "kotlin-android"
}

def localProperties = new Properties()
def localPropertiesFile = new File(rootDir, "local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream -> localProperties.load(stream) }
}
def flutterSdkPath = localProperties.getProperty("flutter.sdk") ?: localProperties.getProperty("flutter.dir")
def flutterVersionName = localProperties.getProperty("flutter.versionName") ?: "1.0.0"
def flutterVersionCode = localProperties.getProperty("flutter.versionCode") ?: "1"

android {
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
        freeCompilerArgs = ["-Xskip-metadata-version-check"]
    }

    defaultConfig {
        applicationId "com.zsdev.fpsmonitor"
        minSdk 24
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
    }

    buildTypes {
        release {
            // CI-friendly: no signing secrets are baked into the repo, so the
            // release build is signed with the well-known debug key. Replace
            // with a real keystore before publishing to the Play Store.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

// Apply Flutter Gradle script via apply-from (same classloader as AGP,
// so com.android.build.OutputFile from AGP 4.2.2 is visible to Flutter's plugin)
if (flutterSdkPath != null) {
    apply from: "$flutterSdkPath/packages/flutter_tools/gradle/flutter.gradle"
}

// Resolve Flutter engine version from the SDK (matches Flutter's own logic)
def flutterEngineVersion = "1.0.0-unknown"
if (flutterSdkPath != null) {
    def engineVersionFile = new File(flutterSdkPath, "bin/internal/engine.version")
    if (engineVersionFile.exists()) {
        flutterEngineVersion = "1.0.0-" + engineVersionFile.text.trim()
    }
}

// Add Flutter embedding and libflutter.so dependencies for release build
android.buildTypes.all { buildType ->
    String flutterBuildMode = buildType.debuggable ? "debug" : (buildType.name == "profile" ? "profile" : "release")
    dependencies.add("${buildType.name}Api", "io.flutter:flutter_embedding_${flutterBuildMode}:$flutterEngineVersion")
    ["armeabi-v7a", "arm64-v8a"].each { abi ->
        String arch = abi.replace("-", "_")
        dependencies.add("${buildType.name}Api", "io.flutter:${arch}_${flutterBuildMode}:$flutterEngineVersion")
    }
}

// Strip path_provider from GeneratedPluginRegistrant.java. path_provider is
// resolved as a transitive Flutter dependency but is not used in this app's
// Dart code, so its plugin class isn't needed. This avoids a Java compile
// error when Flutter's plugin system references it.
afterEvaluate {
    tasks.matching { it.name == 'compileReleaseJavaWithJavac' }.all { task ->
        task.doFirst {
            def registrant = file("src/main/java/io/flutter/plugins/GeneratedPluginRegistrant.java")
            if (registrant.exists()) {
                def content = registrant.text
                content = content.replace("pathprovider.PathProviderPlugin", "/* path_provider stub */")
                registrant.text = content
            }
        }
    }
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib:1.5.31"

    // Shizuku — privileged shell access (requires Shizuku started via ADB/root on device)
    implementation "dev.rikka.shizuku:api:13.1.5"
    implementation "dev.rikka.shizuku:provider:13.1.5"

}
