<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="FPS Monitor banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/>
      <stop offset="1" stop-color="#0B0F16"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F87171"/>
      <stop offset="0.45" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#4ADE80"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ADE80" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#4ADE80" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="28" fill="url(#glow)"/>
  <rect x="1.5" y="1.5" width="1197" height="317" rx="27" fill="none" stroke="#263145" stroke-width="3"/>
  <!-- logo mark -->
  <g transform="translate(70 60) scale(0.39)">
    <rect width="512" height="512" rx="112" fill="#0B0F16" stroke="#2A3548" stroke-width="6"/>
    <path d="M 148 364 A 148 148 0 1 1 364 364" fill="none" stroke="#1F2937" stroke-width="34" stroke-linecap="round"/>
    <path d="M 148 364 A 148 148 0 1 1 364 364" fill="none" stroke="url(#arc)" stroke-width="34" stroke-linecap="round" stroke-dasharray="560 700"/>
    <line x1="256" y1="270" x2="338" y2="172" stroke="#E5E7EB" stroke-width="16" stroke-linecap="round"/>
    <circle cx="256" cy="270" r="26" fill="#E5E7EB"/>
    <circle cx="256" cy="270" r="11" fill="#0D1117"/>
    <text x="256" y="408" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="6" fill="#4ADE80">FPS</text>
  </g>
  <text x="300" y="148" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="82" font-weight="800" fill="#E5E7EB">FPS Monitor</text>
  <text x="302" y="200" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="30" fill="#9CA3AF">Live FPS, temps and performance reports for Android games</text>
  <text x="302" y="250" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="700" fill="#4ADE80">Flutter  •  Kotlin  •  Shizuku</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
