<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="FPS Monitor logo" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2433"/>
      <stop offset="1" stop-color="#0B0F16"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#F87171"/>
      <stop offset="0.45" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#4ADE80"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#2A3548" stroke-width="4"/>
  <!-- gauge track + coloured arc (270 degrees) -->
  <path d="M 148 364 A 148 148 0 1 1 364 364" fill="none" stroke="#1F2937" stroke-width="34" stroke-linecap="round"/>
  <path d="M 148 364 A 148 148 0 1 1 364 364" fill="none" stroke="url(#arc)" stroke-width="34" stroke-linecap="round" stroke-dasharray="560 700"/>
  <!-- needle -->
  <line x1="256" y1="270" x2="338" y2="172" stroke="#E5E7EB" stroke-width="16" stroke-linecap="round"/>
  <circle cx="256" cy="270" r="26" fill="#E5E7EB"/>
  <circle cx="256" cy="270" r="11" fill="#0D1117"/>
  <!-- label -->
  <text x="256" y="408" text-anchor="middle" font-family="'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="64" font-weight="800" letter-spacing="6" fill="#4ADE80">FPS</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
